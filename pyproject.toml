[project]
name = "gtfs-zone-db-models"
version = "0.2.1"
requires-python = ">=3.13"
description = "SQLModel ORM models and Alembic migrations for GTFS transit feed management"
license = "AGPL-3.0-or-later"
dependencies = [
    "sqlmodel>=0.0.21",
    "alembic",
    "asyncpg",
    "pydantic-settings>=2.6",
    "petname>=2.9",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "commitizen",
    "moto[s3]>=5.0",
    "pytest>=8.0",
    "ruff",
]

[project.scripts]
gtfs-zone-db-models-migrate = "gtfs_zone_db_models._migrate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtfs_zone_db_models"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "TC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/gtfs_zone_db_models/__init__.py" = ["F401"]
# Test functions return None and take fixtures; annotating either says nothing.
"tests/**" = ["ANN"]
# Alembic generates these; the long op.* calls are its formatting, not ours.
"src/gtfs_zone_db_models/alembic/**" = ["E501", "ANN"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
bump_message = "chore(release): bump version $current_version -> $new_version"
