[project]
name = "railroad-club"
version = "0.1.0"
requires-python = ">=3.13"
description = "SQLModel ORM models and Alembic migrations for GTFS transit feed management"
dependencies = [
    "sqlmodel>=0.0.21",
    "alembic",
    "asyncpg",
    "pydantic-settings>=2.6",
    "petname>=2.9",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "commitizen",
    "moto[s3]>=5.0",
    "pytest>=8.0",
    "pre-commit",
    "ruff",
]

[project.scripts]
railroad-club-migrate = "railroad_club._migrate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/railroad_club"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "TCH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/railroad_club/__init__.py" = ["F401"]
# Test functions return None and take fixtures; annotating either says nothing.
"tests/*" = ["ANN001", "ANN201"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
