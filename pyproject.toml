[project]
name = "railroad-club"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "sqlmodel>=0.0.21",
    "alembic",
    "asyncpg",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/railroad_club"]

[dependency-groups]
dev = ["commitizen", "pre-commit", "ruff"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
