name: Build

# Lints and tests. The image is not published: nothing deploys it.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # uv fetches its own interpreter when the runner's python does not match
      # requires-python.
      - name: Install project
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      # Not every repo has a test suite yet.
      - name: Test
        run: |
          if [ -d tests ]; then
            uv run pytest
          else
            echo "no tests/ directory, skipping"
          fi
