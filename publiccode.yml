publiccodeYmlVersion: "0.4"

name: GTFS.zone DB Models
url: "https://github.com/gtfs-zone/gtfs-zone-db-models"

platforms:
  - linux

categories:
  - application-development

developmentStatus: beta

softwareType: "library"

description:
  en:
    shortDescription: >
      Shared SQLModel ORM models and Alembic migrations for the gtfs.zone backend services.
    longDescription: >
      GTFS.zone DB Models holds the PostgreSQL schema shared by the
      gtfs.zone backend services: SQLModel ORM models for GTFS Schedule data,
      realtime feeds, trackers and service alerts, and the Alembic migrations
      that create and evolve them. Services consume it as a Python git
      dependency pinned to a release tag.
    features:
      - SQLModel ORM models for GTFS Schedule and realtime data
      - Alembic migrations for the shared schema
      - Pinned by tag in each consuming service

